name: Sjekk nettsiden

# Sjekker hvert 30. minutt at nettsiden virker. Feiler sjekken, sender GitHub en e-post.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_feil:
        description: "Lat som siden er nede (for å teste at varselet kommer)"
        type: boolean
        default: false

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk sunanthaogmorten.no og sunanthaogmorten.com
        env:
          TEST_FEIL: ${{ inputs.test_feil }}
        run: |
          if [ "$TEST_FEIL" = "true" ]; then
            echo "::error::Testvarsel: dette er en planlagt test, nettsiden er ikke nede."
            exit 1
          fi

          sjekk_no() {
            # Hovedsiden svarer over HTTPS og har innholdet vi forventer
            html=$(curl -fsSL --max-time 20 https://sunanthaogmorten.no/) || { echo "sunanthaogmorten.no svarer ikke (eller HTTPS-feil)"; return 1; }
            grep -q "Sunantha" <<< "$html" || { echo "Forsiden mangler forventet innhold"; return 1; }
            grep -q "payhip.com/b/" <<< "$html" || { echo "Kjøpsknappen for oppskriftsheftet mangler"; return 1; }
          }

          sjekk_com() {
            # .com sender videre til .no
            mal=$(curl -s -o /dev/null -L --max-time 20 -w '%{url_effective}' http://sunanthaogmorten.com/)
            case "$mal" in
              https://sunanthaogmorten.no*) ;;
              *) echo "sunanthaogmorten.com sender ikke videre til .no (havnet på: $mal)"; return 1 ;;
            esac
          }

          # Prøv tre ganger med litt pause, så et kort blaff ikke gir falsk alarm
          no_ok=false
          for forsok in 1 2 3; do
            if sjekk_no; then no_ok=true; break; fi
            echo "Forsøk $forsok feilet, prøver igjen om 60 sekunder …"
            sleep 60
          done
          if [ "$no_ok" != true ]; then
            echo "::error::Nettsiden ser ut til å være nede eller feil satt opp. Se loggen over."
            exit 1
          fi

          # .com-videresendingen hos domeneverten svarer av og til ikke GitHubs maskiner i USA,
          # selv om den virker fra Norge. Det gir bare en merknad i loggen, ikke e-post.
          for forsok in 1 2 3; do
            if sjekk_com; then echo "Alt OK"; exit 0; fi
            sleep 60
          done
          echo "::warning::sunanthaogmorten.com svarte ikke på videresending nå (sunanthaogmorten.no virker)."
