name: Oppdater videoer

on:
  schedule:
    - cron: "15 */3 * * *"   # hver 3. time, så nye videoer kommer raskt ut på nettsiden
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 oppdater_videoer.py
      - name: Lagre endringer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add videos.json steder.json
          git diff --cached --quiet || git commit -m "Oppdater videoer og kart"
          git push
